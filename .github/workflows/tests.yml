# Runs the site's automated checks on every push and pull request.
# A red X on a commit in GitHub means a rule broke; the email from GitHub says which test failed.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check data.js && node --check recap.js && node --check app.js
      - name: Session recap rules
        run: node --test tests/*.test.js
